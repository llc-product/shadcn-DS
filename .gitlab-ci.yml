# CI for @digitaltwin/design-system.
#
# Written against a GitLab remote but NOT tied to one: every URL is built from CI_PROJECT_ID and
# CI_SERVER_HOST, so this runs unchanged on whichever GitLab instance the repo ends up on. There
# is no remote configured yet; this file simply waits.

default:
  image: node:22
  before_script:
    - node --version
    - npm ci --no-audit --no-fund

stages:
  - check
  - publish
  - docs

# ── check ───────────────────────────────────────────────────────────────────────────────────────
# Order matters and is not alphabetical:
#   · the generated files are rebuilt and diffed BEFORE anything reads them, so a stale
#     tokens.css or components.md fails here rather than being silently trusted downstream;
#   · the build runs BEFORE the tests, because dist-directives.test.ts inspects dist/ — it is
#     what proves `bundle: false` still holds, and it has nothing to read otherwise.
check:
  stage: check
  script:
    - npm run format:check
    - npm run lint
    - npm run build:tokens
    - npm run build:catalog
    - npm run docs:manifest
    # The generated files are committed. If this fails, someone edited an output instead of its
    # source — run the same three commands locally and commit the result.
    - git diff --exit-code --stat || (echo "GENERATED FILES ARE STALE — see the diff above" && exit 1)
    - npm run typecheck
    - npm run build
    - npm run test:coverage
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: "$CI_COMMIT_BRANCH"

# ── publish ─────────────────────────────────────────────────────────────────────────────────────
# Tag vX.Y.Z publishes packages/ui to this project's GitLab npm registry, using the
# GitLab-provided CI_JOB_TOKEN. No secret variable to rotate.
publish:
  stage: publish
  script:
    - npm run build
    # The .npmrc is written AFTER `npm ci` so dependencies still resolve from the public
    # registry, but BOTH the default `registry=` and the scoped `@digitaltwin:registry` point at
    # GitLab — so a publish can never reach npmjs.org, even if a package name were misresolved.
    # npm reads .npmrc from the current directory only, hence publishing from the repo root with
    # an explicit `./packages/ui` path.
    - |
      REGISTRY="https://${CI_SERVER_HOST}:${CI_SERVER_PORT}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
      printf '%s\n' \
        "registry=${REGISTRY}" \
        "@digitaltwin:registry=${REGISTRY}" \
        "//${CI_SERVER_HOST}:${CI_SERVER_PORT}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" \
        > .npmrc
    # Second guard, independent of the first: refuse to publish anything not scoped
    # @digitaltwin/. Use `./packages/ui` — a bare name would be read as a registry package-spec
    # rather than a folder.
    - node -e "const n=require('./packages/ui/package.json').name; if(!n.startsWith('@digitaltwin/')){console.error('refusing to publish '+n);process.exit(1)}"
    # The tag and the manifest must agree, or a `v0.2.0` tag can publish 0.1.0 and the registry
    # silently disagrees with the git history.
    - node -e "const v=require('./packages/ui/package.json').version; if('v'+v!==process.env.CI_COMMIT_TAG){console.error('tag '+process.env.CI_COMMIT_TAG+' != package version '+v);process.exit(1)}"
    - npm publish ./packages/ui
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

# ── docs ────────────────────────────────────────────────────────────────────────────────────────
# The docs site is the package's first real consumer: if the exports map, the "use client"
# boundaries or the @source line were wrong, this job fails before any app sees it.
pages:
  stage: docs
  variables:
    PUBLIC_PATH: "/$CI_PROJECT_NAME/"
  script:
    - npm run docs:build
    - rm -rf public
    - mv apps/docs/out public
  # GitLab 17.10+: `pages: true` is what registers the deployment. The legacy "job named pages"
  # convention no longer deploys on its own, and `public/` is appended to artifacts:paths
  # automatically, so no artifacts block is needed.
  pages: true
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
